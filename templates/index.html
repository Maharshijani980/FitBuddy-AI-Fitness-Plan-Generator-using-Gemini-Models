<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy AI</title>

    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
            color: #22c55e;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #22c55e;
        }

        select option {
            background: #1e293b;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #22c55e;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #16a34a;
        }

        .admin-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }

        .admin-link a {
            color: #64748b;
            text-decoration: none;
        }

        .admin-link a:hover {
            color: #94a3b8;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>FitBuddy AI</h1>
    <p class="subtitle">Generate your personalized workout plan powered by Gemini AI</p>

    <form action="/generate-workout" method="post">

        <label>Full Name</label>
        <input type="text" name="username" placeholder="e.g. John Doe" required>

        <label>Age</label>
        <input type="number" name="age" placeholder="e.g. 25" min="10" max="100" required>

        <label>Weight (kg)</label>
        <input type="number" name="weight" placeholder="e.g. 75" min="30" max="300" required>

        <label>Fitness Goal</label>
        <select name="goal">
            <option value="muscle gain">Muscle Gain</option>
            <option value="weight loss">Weight Loss</option>
            <option value="general fitness">General Fitness</option>
        </select>

        <label>Workout Intensity</label>
        <select name="intensity">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <button type="submit">Generate My Workout Plan</button>

    </form>

    <div class="admin-link">
        <a href="/view-all-users">Admin Dashboard</a>
    </div>

</div>

</body>
</html>
